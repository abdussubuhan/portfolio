<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethereal Fluid Simulation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f7f4;
            color: #1a1918;
            overflow: hidden;
            display: flex;
            height: 100vh;
        }

        #canvas-container {
            flex: 1;
            position: relative;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            padding: 3rem;
            z-index: 10;
        }

        .title-area h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-transform: lowercase;
        }

        .title-area p {
            font-size: 0.8rem;
            color: #8a8580;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .controls {
            pointer-events: auto;
            width: 250px;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(168,162,158,0.3);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .control-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
            color: #1a1918;
        }

        .control-group input[type="range"] {
            width: 100%;
            appearance: none;
            height: 2px;
            background: #d4d0cb;
            outline: none;
        }

        .control-group input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #1a1918;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .control-group input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .hint {
            position: absolute;
            bottom: 3rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8rem;
            color: #a8a29e;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            animation: pulseHint 2s infinite;
        }

        @keyframes pulseHint {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

    </style>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div id="canvas-container">
        <canvas id="fluidCanvas"></canvas>
        
        <div class="ui-overlay">
            <div class="title-area">
                <h1>ethereal</h1>
                <p>Generative silver fluid</p>
            </div>
            
            <div class="controls">
                <div class="control-group">
                    <label>Viscosity</label>
                    <input type="range" id="viscosity" min="0.8" max="0.99" step="0.01" value="0.95">
                </div>
                <div class="control-group">
                    <label>Density</label>
                    <input type="range" id="density" min="10" max="100" step="5" value="50">
                </div>
                <div class="control-group">
                    <label>Force</label>
                    <input type="range" id="force" min="0.1" max="2" step="0.1" value="0.5">
                </div>
            </div>
            
            <div class="hint">Move cursor to disturb</div>
        </div>
    </div>

    <script>
        // Custom lightweight fluid ribbon simulation on Canvas
        const canvas = document.getElementById('fluidCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        
        const params = {
            friction: Number(document.getElementById('viscosity').value),
            spring: 0.05,
            spacing: 5,
            tension: 0.5,
            mass: Number(document.getElementById('density').value)
        };

        document.getElementById('viscosity').addEventListener('input', (e) => params.friction = Number(e.target.value));
        document.getElementById('density').addEventListener('input', (e) => params.mass = Number(e.target.value));
        
        // A single ribbon is composed of points
        class Point {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.targetX = x;
                this.targetY = y;
                this.vx = 0;
                this.vy = 0;
            }

            update() {
                // Spring towards target target
                const dx = this.targetX - this.x;
                const dy = this.targetY - this.y;
                
                this.vx += dx * params.spring;
                this.vy += dy * params.spring;
                
                this.vx *= params.friction;
                this.vy *= params.friction;
                
                this.x += this.vx;
                this.y += this.vy;
            }
        }

        let ribbons = [];
        const numRibbons = 5;

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            
            ribbons = [];
            // Create a few parallel ribbons horizontally across the screen
            for(let i=0; i<numRibbons; i++) {
                const points = [];
                const yOffset = (height / 2) + ((i - Math.floor(numRibbons/2)) * 30);
                
                for(let x = 0; x <= width + 50; x += (150 - params.mass)) {
                    points.push(new Point(x, yOffset));
                }
                ribbons.push(points);
            }
        }

        window.addEventListener('resize', init);
        init();

        // Mouse interaction
        let mouseX = width / 2;
        let mouseY = height / 2;
        let pMouseX = mouseX;
        let pMouseY = mouseY;
        let isMoving = false;
        let forceMult = Number(document.getElementById('force').value);
        
        document.getElementById('force').addEventListener('input', (e) => forceMult = Number(e.target.value));

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            isMoving = true;
        });

        // Loop
        function draw() {
            ctx.clearRect(0, 0, width, height);

            const dx = mouseX - pMouseX;
            const dy = mouseY - pMouseY;
            const mouseDist = Math.sqrt(dx*dx + dy*dy);
            
            pMouseX = mouseX;
            pMouseY = mouseY;

            // Update points based on mouse proximity
            for(let i=0; i<ribbons.length; i++) {
                const points = ribbons[i];
                for(let j=0; j<points.length; j++) {
                    const point = points[j];
                    
                    if (isMoving && mouseDist > 0) {
                        const distToMouse = Math.sqrt((point.x - mouseX)**2 + (point.y - mouseY)**2);
                        if (distToMouse < 200) {
                            // push away based on radius/distance
                            const effect = (1 - (distToMouse / 200)) * forceMult;
                            point.vx += dx * effect * 0.1;
                            point.vy += dy * effect * 0.1;
                        }
                    }
                    // Mild wave animation base
                    point.targetY += Math.sin(Date.now() * 0.001 + point.x * 0.01 + i) * 0.5;
                    
                    point.update();
                }
                
                // Draw Ribbon
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                
                for(let j=0; j<points.length - 1; j++) {
                    const current = points[j];
                    const next = points[j+1];
                    const xc = (current.x + next.x) / 2;
                    const yc = (current.y + next.y) / 2;
                    ctx.quadraticCurveTo(current.x, current.y, xc, yc);
                }
                ctx.lineTo(points[points.length-1].x, points[points.length-1].y);
                
                // Gradient styling for metallic fluid look
                const grad = ctx.createLinearGradient(0, 0, 0, height);
                grad.addColorStop(0, `rgba(168, 162, 158, ${0.4 - (i*0.05)})`);
                grad.addColorStop(1, `rgba(212, 208, 203, ${0.8 - (i*0.1)})`);
                
                ctx.strokeStyle = grad;
                ctx.lineWidth = 15 + (i * 5); // thicker lines
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
                
                // Highlight line to enhance 3D metallic feel
                ctx.strokeStyle = `rgba(255, 255, 255, ${0.3 - (i*0.02)})`;
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            isMoving = false;
            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
