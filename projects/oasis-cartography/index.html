<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oasis Cartography</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root {
            --bg-base: #020202;
            --map-line: rgba(255, 255, 255, 0.05);
            --map-accent: rgba(255, 255, 255, 0.2);
            --silver: #e0e0e0;
            --text-muted: #666;
            --font-ui: 'Outfit', sans-serif;
            --font-data: 'Space Mono', monospace;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-base);
            color: var(--silver);
            font-family: var(--font-ui);
            overflow: hidden;
        }

        /* Abstract Map Background Simulation */
        .map-layer {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(var(--map-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--map-line) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
            perspective: 1000px;
        }

        .svg-routes {
            width: 100%;
            height: 100%;
            position: absolute;
            z-index: 1;
            opacity: 0.5;
        }

        .route-path {
            fill: none;
            stroke: var(--map-accent);
            stroke-width: 2;
            stroke-dasharray: 10 5;
            animation: dash 30s linear infinite;
        }

        @keyframes dash {
            to {
                stroke-dashoffset: -1000;
            }
        }

        .map-node {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px rgba(255,255,255,0.8);
            z-index: 2;
        }

        .map-node::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 30px; height: 30px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: radar 2s ease-out infinite;
        }

        @keyframes radar {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
        }

        /* UI Overlay */
        .ui-container {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 10;
            padding: 40px;
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            grid-template-rows: auto 1fr auto;
            gap: 20px;
        }

        .panel {
            pointer-events: auto;
            background: rgba(10, 10, 10, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 20px;
        }

        .top-left { grid-column: 1; grid-row: 1; }
        .bottom-left { grid-column: 1; grid-row: 3; }
        .right-panel { grid-column: 3; grid-row: 1 / span 3; }

        .panel-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-family: var(--font-data);
            font-size: 0.85rem;
        }

        .target-list .target-item {
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .target-item:hover {
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.2);
        }

        .target-item .status {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--silver);
        }

        /* Custom Crosshair Cursor */
        .crosshair {
            position: fixed;
            width: 40px; height: 40px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            pointer-events: none;
            z-index: 100;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s;
        }
        
        .crosshair::before, .crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255,255,255,0.5);
        }

        .crosshair::before { top: -10px; bottom: -10px; left: 19px; width: 1px; }
        .crosshair::after { left: -10px; right: -10px; top: 19px; height: 1px; }

    </style>
</head>
<body>

    <div class="crosshair" id="crosshair"></div>

    <div class="map-layer">
        <svg class="svg-routes" preserveAspectRatio="none">
            <path class="route-path" d="M 100 800 Q 300 500 500 400 T 1200 200" />
            <path class="route-path" d="M 800 900 Q 900 600 1100 500 T 1800 300" style="stroke-dasharray: 5 15;" />
        </svg>

        <!-- Nodes -->
        <div class="map-node" style="top: 400px; left: 500px;"></div>
        <div class="map-node" style="top: 200px; left: 1200px;"></div>
        <div class="map-node" style="top: 500px; left: 1100px;"></div>
    </div>

    <div class="ui-container">
        <div class="panel top-left system-info">
            <div class="panel-title">System telemetry</div>
            <div class="data-row"><span>LAT</span> <span id="lat-display">40.7128 N</span></div>
            <div class="data-row"><span>LNG</span> <span id="lng-display">74.0060 W</span></div>
            <div class="data-row"><span>ALT</span> <span>84,000 FT</span></div>
            <div class="data-row"><span>STS</span> <span style="color: #fff;">ACTIVE</span></div>
        </div>

        <div class="panel bottom-left">
            <div class="panel-title">Scan radius</div>
            <svg viewBox="0 0 100 50" style="width: 100%; height: 50px;">
                <!-- Simulated histogram -->
                <rect x="0" y="30" width="8" height="20" fill="rgba(255,255,255,0.2)"/>
                <rect x="12" y="10" width="8" height="40" fill="rgba(255,255,255,0.4)"/>
                <rect x="24" y="25" width="8" height="25" fill="rgba(255,255,255,0.3)"/>
                <rect x="36" y="5" width="8" height="45" fill="rgba(255,255,255,0.8)"/>
                <rect x="48" y="20" width="8" height="30" fill="rgba(255,255,255,0.5)"/>
                <rect x="60" y="35" width="8" height="15" fill="rgba(255,255,255,0.2)"/>
                <rect x="72" y="15" width="8" height="35" fill="rgba(255,255,255,0.6)"/>
                <rect x="84" y="28" width="8" height="22" fill="rgba(255,255,255,0.3)"/>
            </svg>
        </div>

        <div class="panel right-panel">
            <div class="panel-title">Active Targets</div>
            <div class="target-list">
                <div class="target-item">
                    <div class="status"></div>
                    <div>
                        <div style="font-weight: 500; font-size: 0.9rem;">Alpha Node</div>
                        <div style="font-size: 0.75rem; color: #888; font-family: var(--font-data);">DIST: 4.2 KM</div>
                    </div>
                </div>
                <div class="target-item">
                    <div class="status" style="opacity: 0.5;"></div>
                    <div>
                        <div style="font-weight: 500; font-size: 0.9rem;">Beta Sector</div>
                        <div style="font-size: 0.75rem; color: #888; font-family: var(--font-data);">DIST: 12.8 KM</div>
                    </div>
                </div>
                <div class="target-item">
                    <div class="status"></div>
                    <div>
                        <div style="font-weight: 500; font-size: 0.9rem;">Gamma Relay</div>
                        <div style="font-size: 0.75rem; color: #888; font-family: var(--font-data);">DIST: 8.4 KM</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Custom Crosshair Logic
        const crosshair = document.getElementById('crosshair');
        const latDisplay = document.getElementById('lat-display');
        const lngDisplay = document.getElementById('lng-display');

        window.addEventListener('mousemove', (e) => {
            gsap.to(crosshair, {
                x: e.clientX,
                y: e.clientY,
                duration: 0.1,
                ease: "none"
            });

            // Update fake lat/lng based on mouse
            const lat = 40.7128 + (e.clientY / window.innerHeight) * 0.1;
            const lng = 74.0060 + (e.clientX / window.innerWidth) * 0.1;
            
            latDisplay.innerText = lat.toFixed(4) + " N";
            lngDisplay.innerText = lng.toFixed(4) + " W";
        });

        // Hover effects on interactive elements
        document.querySelectorAll('.target-item').forEach(item => {
            item.addEventListener('mouseenter', () => {
                crosshair.style.width = '60px';
                crosshair.style.height = '60px';
                crosshair.style.borderColor = 'rgba(255,255,255,0.8)';
            });
            
            item.addEventListener('mouseleave', () => {
                crosshair.style.width = '40px';
                crosshair.style.height = '40px';
                crosshair.style.borderColor = 'rgba(255,255,255,0.3)';
            });
        });

        // Entrance animation
        gsap.from(".panel", {
            duration: 1,
            y: 20,
            opacity: 0,
            stagger: 0.1,
            ease: "power3.out"
        });
    </script>
</body>
</html>
