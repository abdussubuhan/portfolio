<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: #0d0d0c; /* Very dark, almost black */
            color: #f8f7f4;
            padding: 2rem;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .subtitle {
            font-size: 0.8rem;
            color: #8a8580;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-top: 0.5rem;
        }

        /* Bento Grid */
        .bento {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: auto auto auto;
            gap: 1.5rem;
        }

        .card {
            background: #1a1918;
            border: 1px solid rgba(168,162,158,0.2);
            border-radius: 24px;
            padding: 1.5rem;
            transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(168,162,158,0.5);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .card-title {
            font-size: 0.85rem;
            color: #a8a29e;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .card-value {
            font-size: 2.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 300;
        }
        
        .card-trend {
            font-size: 0.8rem;
            color: #4ade80; /* Subtle green */
            margin-top: 0.5rem;
        }

        /* Grid Spans */
        .span-2 { grid-column: span 2; }
        .span-full { grid-column: 1 / -1; }
        .row-span-2 { grid-row: span 2; }

        /* Chart Containers */
        .chart-container {
            width: 100%;
            height: 200px;
            position: relative;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
        }
        
        /* Custom UI Elements inside cards */
        .progress-ring {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            position: relative;
        }
        
        .progress-ring p {
            position: absolute;
            font-size: 2rem;
            font-weight: 300;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header class="header">
        <div>
            <h1 class="title">Nexus Analytics</h1>
            <p class="subtitle">Real-time Performance Overview</p>
        </div>
        <div>
            <button style="padding: 0.8rem 1.5rem; background: #f8f7f4; color: #0d0d0c; border: none; border-radius: 20px; font-weight: 500; cursor: pointer;">Export Report</button>
        </div>
    </header>

    <div class="bento">
        <!-- KPI 1 -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">Total Revenue</span>
                <span style="color: #a8a29e">●</span>
            </div>
            <div class="card-value">$84,500</div>
            <div class="card-trend">↑ 12.5% from last month</div>
        </div>

        <!-- KPI 2 -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">Active Users</span>
            </div>
            <div class="card-value">12,405</div>
            <div class="card-trend">↑ 4.2% from last month</div>
        </div>

        <!-- Main Chart -->
        <div class="card span-2 row-span-2">
            <div class="card-header">
                <span class="card-title">User Engagement Overview</span>
            </div>
            <div class="chart-container" style="height: 300px;">
                <canvas id="mainChart"></canvas>
            </div>
        </div>

        <!-- Secondary Metric -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">Bounce Rate</span>
            </div>
            <div class="card-value">24.8%</div>
            <div class="card-trend" style="color: #f87171">↓ -2.1% from last month</div>
        </div>

        <!-- Progress Ring -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">Server Load</span>
            </div>
            <div class="chart-container" style="height: 120px; display: flex; align-items: center; justify-content: center; position: relative;">
                <canvas id="doughnutChart"></canvas>
                <div style="position: absolute; font-size: 1.5rem;">68%</div>
            </div>
        </div>

        <!-- Bottom Chart -->
        <div class="card span-full">
            <div class="card-header">
                <span class="card-title">Weekly Traffic Distribution</span>
            </div>
            <div class="chart-container">
                <canvas id="barChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Chart.js global config for dark luxury theme
        Chart.defaults.color = '#8a8580';
        Chart.defaults.font.family = 'Inter';
        
        // Gradient for main chart
        const ctxMain = document.getElementById('mainChart').getContext('2d');
        const gradientMain = ctxMain.createLinearGradient(0, 0, 0, 300);
        gradientMain.addColorStop(0, 'rgba(168,162,158, 0.4)');
        gradientMain.addColorStop(1, 'rgba(168,162,158, 0.0)');

        // Main Line Chart
        new Chart(ctxMain, {
            type: 'line',
            data: {
                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul'],
                datasets: [{
                    label: 'Engagement',
                    data: [65, 59, 80, 81, 56, 85, 95],
                    borderColor: '#f8f7f4', // Off-white
                    backgroundColor: gradientMain,
                    borderWidth: 2,
                    tension: 0.4,
                    fill: true,
                    pointBackgroundColor: '#1a1918',
                    pointBorderColor: '#f8f7f4',
                    pointBorderWidth: 2,
                    pointRadius: 4,
                    pointHoverRadius: 6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: {
                        grid: { color: 'rgba(168,162,158,0.1)' },
                        border: { display: false }
                    },
                    x: {
                        grid: { display: false },
                        border: { display: false }
                    }
                }
            }
        });

        // Doughnut Chart (Server Load)
        new Chart(document.getElementById('doughnutChart'), {
            type: 'doughnut',
            data: {
                datasets: [{
                    data: [68, 32],
                    backgroundColor: ['#a8a29e', 'rgba(168,162,158,0.1)'],
                    borderWidth: 0,
                    cutout: '80%'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { tooltip: { enabled: false } },
                animation: { animateRotate: true }
            }
        });

        // Bar Chart (Traffic)
        new Chart(document.getElementById('barChart'), {
            type: 'bar',
            data: {
                labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                datasets: [{
                    label: 'Traffic',
                    data: [1200, 1900, 1500, 2200, 2800, 1600, 1100],
                    backgroundColor: '#a8a29e',
                    borderRadius: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { display: false },
                    x: {
                        grid: { display: false },
                        border: { display: false }
                    }
                }
            }
        });
    </script>
</body>
</html>
