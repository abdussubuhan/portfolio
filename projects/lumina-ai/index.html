<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina AI Studio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #1a1918;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(168,162,158,0.2);
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .credits {
            font-size: 0.8rem;
            color: #8a8580;
            padding: 0.5rem 1rem;
            background: #f8f7f4;
            border-radius: 20px;
        }

        .workspace {
            width: 100%;
            max-width: 1200px;
            padding: 4rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            font-weight: 600;
            margin-bottom: 1rem;
            text-align: center;
        }

        p.subline {
            color: #8a8580;
            font-size: 1.1rem;
            margin-bottom: 4rem;
        }

        /* The Input Bar */
        .prompt-container {
            width: 100%;
            max-width: 800px;
            position: relative;
            margin-bottom: 4rem;
        }

        /* Glowing energetic wrapper */
        .prompt-glow {
            position: absolute;
            inset: -2px;
            background: linear-gradient(90deg, #d4d0cb, #f0ede8, #a8a29e, #d4d0cb);
            background-size: 400% 400%;
            border-radius: 40px;
            z-index: 0;
            opacity: 0.5;
            transition: opacity 0.3s;
        }

        .prompt-container.active .prompt-glow {
            animation: glowMove 3s ease infinite;
            opacity: 1;
        }

        @keyframes glowMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .prompt-box {
            position: relative;
            z-index: 1;
            background: #ffffff;
            border-radius: 38px;
            padding: 0.5rem 0.5rem 0.5rem 2rem;
            display: flex;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .prompt-box input {
            flex: 1;
            border: none;
            outline: none;
            font-family: 'Inter', sans-serif;
            font-size: 1.1rem;
            background: transparent;
            color: #1a1918;
        }

        .prompt-box input::placeholder {
            color: #d4d0cb;
        }

        .generate-btn {
            background: #1a1918;
            color: #ffffff;
            border: none;
            border-radius: 30px;
            padding: 1rem 2rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .generate-btn:hover {
            transform: scale(1.02);
            background: #3a3835;
        }

        /* Particle Processing Animation Overlay */
        .processing-overlay {
            position: absolute;
            inset: 0;
            top: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        .processing-overlay.active {
            opacity: 1;
        }

        .loader-ring {
            width: 60px;
            height: 60px;
            border: 2px solid #f8f7f4;
            border-top-color: #1a1918;
            border-radius: 50%;
            animation: spin 1s infinite linear;
            margin-bottom: 1rem;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Gallery Grid */
        .gallery {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            opacity: 1;
            transition: opacity 0.5s;
        }

        .gallery.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .img-card {
            aspect-ratio: 1;
            background: #f8f7f4;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            border: 1px solid rgba(168,162,158,0.2);
        }
        
        .img-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #e8e4df, #d4d0cb);
            position: relative;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .img-card:hover .img-fill {
            transform: scale(1.05);
        }

        .img-card::after {
            content: 'View Details';
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 0.85rem;
            font-weight: 500;
            color: #1a1918;
            backdrop-filter: blur(4px);
        }

        .img-card:hover::after {
            opacity: 1;
        }

        /* Mock Canvas Drawing inside .img-fill */
        .pattern1 { background: repeating-linear-gradient(45deg, #e8e4df, #e8e4df 10px, #d4d0cb 10px, #d4d0cb 20px); }
        .pattern2 { background: radial-gradient(circle at center, #ffffff 0%, #a8a29e 100%); }
        .pattern3 { background: linear-gradient(to right, #f8f7f4, #c4a882 50%, #f8f7f4); }

    </style>
</head>
<body>

    <header class="header">
        <div class="logo">Lumina</div>
        <div class="credits" id="credits">1,450 Credits</div>
    </header>

    <div class="workspace">
        <h1>Imagine anything.</h1>
        <p class="subline">High-fidelity minimalist generation model v4.2</p>

        <div class="prompt-container" id="promptContainer">
            <div class="prompt-glow"></div>
            <div class="prompt-box">
                <input type="text" id="promptInput" placeholder="A futuristic museum interior with silver accents...">
                <button class="generate-btn" id="generateBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                    Generate
                </button>
            </div>
        </div>

        <div class="processing-overlay" id="overlay">
            <div class="loader-ring"></div>
            <div style="font-family: 'Playfair Display', serif; color: #8a8580; font-style: italic;">Synthesizing visual concepts...</div>
        </div>

        <div class="gallery" id="gallery">
            <div class="img-card"><div class="img-fill pattern1"></div></div>
            <div class="img-card"><div class="img-fill pattern2"></div></div>
            <div class="img-card"><div class="img-fill pattern3"></div></div>
            <div class="img-card"><div class="img-fill pattern2"></div></div>
            <div class="img-card"><div class="img-fill pattern3"></div></div>
            <div class="img-card"><div class="img-fill pattern1"></div></div>
        </div>
    </div>

    <script>
        const input = document.getElementById('promptInput');
        const container = document.getElementById('promptContainer');
        const btn = document.getElementById('generateBtn');
        const overlay = document.getElementById('overlay');
        const gallery = document.getElementById('gallery');
        const credits = document.getElementById('credits');

        input.addEventListener('focus', () => { container.classList.add('active'); });
        input.addEventListener('blur', () => { 
            if(!input.value) container.classList.remove('active'); 
        });

        btn.addEventListener('click', () => {
            if(!input.value) return;

            // Start generation sequence
            btn.innerHTML = 'Synthesizing...';
            btn.disabled = true;
            gallery.classList.add('hidden');
            
            setTimeout(() => {
                overlay.classList.add('active');
            }, 500);

            // Mock generation time
            setTimeout(() => {
                overlay.classList.remove('active');
                
                // Shuffle gallery patterns to mock "new" images
                const cards = document.querySelectorAll('.img-fill');
                const patterns = ['pattern1', 'pattern2', 'pattern3'];
                cards.forEach(card => {
                    card.className = `img-fill ${patterns[Math.floor(Math.random() * patterns.length)]}`;
                });

                setTimeout(() => {
                    gallery.classList.remove('hidden');
                    btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg> Generate`;
                    btn.disabled = false;
                    
                    // Deduct credit
                    credits.textContent = '1,449 Credits';
                    credits.style.background = '#e8e4df';
                    setTimeout(() => credits.style.background = '#f8f7f4', 300);

                }, 500);
            }, 3000);
        });
        
        input.addEventListener('keypress', (e) => {
            if(e.key === 'Enter') btn.click();
        });
    </script>
</body>
</html>
